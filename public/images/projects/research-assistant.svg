<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090A0D"/>
      <stop offset="100%" stop-color="#111319"/>
    </linearGradient>
    <radialGradient id="radial2" cx="30%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFAA32" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#090A0D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#radial2)"/>

  <!-- Chrome Window + Side Panel Mockup -->
  <g transform="translate(140, 85)">
    <rect width="920" height="505" rx="12" fill="#151820" stroke="#FFAA32" stroke-opacity="0.25" stroke-width="1.5"/>
    <!-- Top Bar -->
    <rect width="920" height="42" rx="12" fill="#1a1e28"/>
    <circle cx="28" cy="21" r="5" fill="#EF4444"/>
    <circle cx="48" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="68" cy="21" r="5" fill="#10B981"/>
    <!-- URL Bar -->
    <rect x="110" y="8" width="460" height="26" rx="6" fill="#090A0D"/>
    <text x="130" y="25" fill="#A5A9B2" font-family="'Inter', sans-serif" font-size="11">https://research.nature.com/articles/ai-advances</text>

    <!-- Main Web Page Area -->
    <rect x="25" y="65" width="540" height="415" rx="8" fill="#0E1017"/>
    <text x="50" y="105" fill="#F5F5F5" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16">Autonomous Agentic Reasoning Systems</text>
    
    <!-- Highlighted Text Block -->
    <rect x="50" y="130" width="490" height="75" rx="4" fill="#FF7900" fill-opacity="0.2" stroke="#FF7900" stroke-opacity="0.6"/>
    <text x="65" y="155" fill="#F5F5F5" font-family="'Inter', sans-serif" font-size="12">"By orchestrating reactive microservices alongside LLM reasoning</text>
    <text x="65" y="175" fill="#F5F5F5" font-family="'Inter', sans-serif" font-size="12">loops, real-time contextual synthesis achieves unprecedented accuracy."</text>

    <text x="50" y="240" fill="#A5A9B2" font-family="'Inter', sans-serif" font-size="12">Selected text dispatched via Chrome Runtime to Manifest V3 side panel...</text>

    <!-- Side Panel Extension Interface -->
    <rect x="590" y="65" width="305" height="415" rx="8" fill="#1a1e28" stroke="#FF7900" stroke-opacity="0.3"/>
    
    <!-- Extension Header -->
    <rect x="590" y="65" width="305" height="45" rx="8" fill="#151820"/>
    <text x="615" y="93" fill="#FF7900" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="13">AI RESEARCH ASSISTANT</text>
    <circle cx="870" cy="88" r="4" fill="#10B981"/>

    <!-- Action Pill -->
    <rect x="610" y="125" width="130" height="30" rx="15" fill="#FF7900" fill-opacity="0.15" stroke="#FF7900" stroke-opacity="0.5"/>
    <text x="630" y="145" fill="#FFAA32" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">SUMMARIZE</text>

    <rect x="750" y="125" width="120" height="30" rx="15" fill="#090A0D"/>
    <text x="775" y="145" fill="#A5A9B2" font-family="'Space Grotesk', sans-serif" font-size="11">SAVE NOTE</text>

    <!-- AI Summary Box -->
    <rect x="610" y="175" width="265" height="150" rx="6" fill="#0E1017" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="625" y="202" fill="#FFAA32" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11">GEMINI PRO SYNTHESIS:</text>
    <text x="625" y="225" fill="#F5F5F5" font-family="'Inter', sans-serif" font-size="11">1. Decouples front-end UI from AI calls.</text>
    <text x="625" y="245" fill="#F5F5F5" font-family="'Inter', sans-serif" font-size="11">2. Spring Boot WebClient streams async.</text>
    <text x="625" y="265" fill="#F5F5F5" font-family="'Inter', sans-serif" font-size="11">3. Latency reduced by 64% with caching.</text>
    <text x="625" y="295" fill="#10B981" font-family="'Space Grotesk', sans-serif" font-size="10">✓ Synced to local research notes</text>

    <!-- Status Bar -->
    <rect x="610" y="340" width="265" height="40" rx="6" fill="#151820"/>
    <text x="625" y="365" fill="#A5A9B2" font-family="'Inter', sans-serif" font-size="10">Spring Boot REST API • Status 200 OK</text>
  </g>
</svg>

