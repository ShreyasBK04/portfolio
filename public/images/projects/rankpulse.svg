      <circle cx="280" cy="95" r="4" fill="#FF7900" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="410" cy="55" r="4" fill="#FF7900" stroke="#ffffff" stroke-width="1.5"/>
