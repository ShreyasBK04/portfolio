      <text x="20" y="95" fill="#10B981" font-family="'Inter', sans-serif" font-size="12">✓ Spring Scheduling: Daily Automated Cron Checks</text>
      <text x="20" y="125" fill="#10B981" font-family="'Inter', sans-serif" font-size="12">✓ Spring Data JPA, DTOs &amp; Global Exception Handling</text>
      <text x="20" y="155" fill="#10B981" font-family="'Inter', sans-serif" font-size="12">✓ Responsive React Dashboard with Ranking Charts &amp; Alerts</text>
      <text x="20" y="185" fill="#FFAA32" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">MySQL Relational Storage • Historical Keyword Position Tracking</text>
